name: Release Package Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（可选，如 0.1.0；留空则自动读取 pom.xml 版本号）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # 1. 前后端统一编译 Job (编译 Fat JAR、生成启动脚本与 Base 包)
  build-app:
    name: Build Frontend & Backend JAR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve_version.outputs.version }}
      tag_name: ${{ steps.resolve_version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'st-cute-web/pnpm-lock.yaml'

      - name: Build Frontend
        run: |
          cd st-cute-web
          pnpm install
          pnpm build

      - name: Copy Frontend Assets to Backend
        run: |
          mkdir -p st-cute-service/src/main/resources/static
          cp -r st-cute-web/dist/* st-cute-service/src/main/resources/static/

      - name: Set up JDK 25 with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend with Maven
        run: |
          cd st-cute-service
          mvn clean package -DskipTests -B

      - name: Resolve Version, Prepare Dist Files & Build Base Package
        id: resolve_version
        run: |
          mkdir -p dist_app
          cp st-cute-service/target/st-cute-service-*.jar dist_app/app.jar

          # 解析版本号优先级：输入的版本号 > Git Tag > pom.xml 中的 <version> (精准跳过 parent 块)
          POM_VERSION=$(sed -n '/<\/parent>/,/<dependencies>/p' st-cute-service/pom.xml | grep -m 1 '<version>' | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | tr -d ' \r\n')
          INPUT_VER="${{ inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
              RAW_VER="$INPUT_VER"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              RAW_VER="${GITHUB_REF_NAME}"
          else
              RAW_VER="$POM_VERSION"
          fi

          # 规范化：包名版本统一去除 v 前缀 (如 0.1.6)，Release Tag 统一保留 v 前缀 (如 v0.1.6)
          FINAL_VERSION=$(echo "$RAW_VER" | sed -e 's#^refs/tags/##' -e 's#^v##')
          TAG_NAME="v$FINAL_VERSION"

          echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "$FINAL_VERSION" > dist_app/version.txt
          echo "Resolved release version: $FINAL_VERSION (Tag: $TAG_NAME)"

          # 生成 Windows 启动脚本 (st-cute.cmd)
          cat << 'EOF' > dist_app/st-cute.cmd
          @echo off
          setlocal enabledelayedexpansion
          cd /d "%~dp0"
          
          set "JAVA_CMD="
          if exist "%~dp0jre\bin\java.exe" (
              set "JAVA_CMD=%~dp0jre\bin\java.exe"
              goto :RUN
          )
          if exist "%~dp0jdk\bin\java.exe" (
              set "JAVA_CMD=%~dp0jdk\bin\java.exe"
              goto :RUN
          )
          where java >nul 2>nul
          if %errorlevel% equ 0 (
              set "JAVA_CMD=java"
              goto :RUN
          )
          
          echo [ERROR] 未找到 Java 环境！
          echo 请在当前目录下放置 jre 或 jdk 目录，或者配置系统 Java 环境变量。
          pause
          exit /b 1
          
          :RUN
          set "JAVA_OPTS=%ST_CUTE_JAVA_OPTS%"
          if not defined JAVA_OPTS set "JAVA_OPTS=-Xms256m -Xmx1024m"
          "%JAVA_CMD%" %JAVA_OPTS% -jar "%~dp0app.jar"
          pause
          EOF
          # 转换为 Windows CRLF 换行符
          sed -i 's/$/\r/' dist_app/st-cute.cmd

          # 生成 Linux 启动脚本 (st-cute.sh)
          cat << 'EOF' > dist_app/st-cute.sh
          #!/usr/bin/env bash
          SCRIPT_DIR="$(cd "$(dirname "$0")"; pwd)"
          cd "$SCRIPT_DIR"

          JAVA_CMD=""
          if [ -x "$SCRIPT_DIR/jre/bin/java" ]; then
              JAVA_CMD="$SCRIPT_DIR/jre/bin/java"
          elif [ -x "$SCRIPT_DIR/jdk/bin/java" ]; then
              JAVA_CMD="$SCRIPT_DIR/jdk/bin/java"
          elif command -v java >/dev/null 2>&1; then
              JAVA_CMD="java"
          fi

          if [ -z "$JAVA_CMD" ]; then
              echo "[ERROR] 未找到 Java 环境！"
              echo "请在当前目录下放置 jre 或 jdk 目录，或者配置系统 Java 环境变量。"
              exit 1
          fi

          JAVA_OPTS="${ST_CUTE_JAVA_OPTS:--Xms256m -Xmx1024m}"
          "$JAVA_CMD" $JAVA_OPTS -jar "$SCRIPT_DIR/app.jar" "$@"
          EOF
          chmod +x dist_app/st-cute.sh

          # 生成 macOS 双击启动脚本 (st-cute.command)
          cp dist_app/st-cute.sh dist_app/st-cute.command
          chmod +x dist_app/st-cute.command

          # 生成 Base 包 (.zip，仅包含纯 app.jar)
          mkdir -p dist_base
          cp dist_app/app.jar dist_base/app.jar
          (cd dist_base && zip -r "../st-cute-base-${FINAL_VERSION}.zip" .)

      - name: Upload Base Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-base
          path: st-cute-base-*.*

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist_app/

  # 2. 矩阵并行构建各平台的 JRE 裁剪包
  build-jre-packages:
    name: Build JRE Package (${{ matrix.target }})
    needs: build-app
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            os: windows-latest
            arch: x64
            archive_ext: zip
          - target: linux-x64
            os: ubuntu-latest
            arch: x64
            archive_ext: tar.gz
          - target: mac-arm64
            os: macos-latest
            arch: aarch64
            archive_ext: tar.gz
          - target: mac-x64
            os: macos-latest
            arch: x64
            archive_ext: tar.gz

    steps:
      - name: Download App Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: app-dist

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: ${{ matrix.arch }}

      - name: Build JRE Package & Archive
        shell: bash
        run: |
          mkdir -p dist_pkg
          cp app-dist/app.jar dist_pkg/app.jar

          # 复制对应平台的启动脚本
          if [ "${{ matrix.target }}" = "win-x64" ]; then
            cp app-dist/st-cute.cmd dist_pkg/st-cute.cmd
          elif [[ "${{ matrix.target }}" == mac-* ]]; then
            cp app-dist/st-cute.sh dist_pkg/st-cute.sh
            cp app-dist/st-cute.command dist_pkg/st-cute.command
            chmod +x dist_pkg/st-cute.sh dist_pkg/st-cute.command
          else
            cp app-dist/st-cute.sh dist_pkg/st-cute.sh
            chmod +x dist_pkg/st-cute.sh
          fi

          # 寻找 jlink 可执行程序（兼容 Windows 与 Unix）
          JLINK_BIN="$JAVA_HOME/bin/jlink"
          if [ -f "$JAVA_HOME/bin/jlink.exe" ]; then
            JLINK_BIN="$JAVA_HOME/bin/jlink.exe"
          fi

          "$JLINK_BIN" \
            --module-path "$JAVA_HOME/jmods" \
            --add-modules java.base,java.logging,java.xml,java.naming,java.management,java.instrument,java.sql,java.transaction.xa,java.desktop,java.security.jgss,java.security.sasl,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.charsets,jdk.localedata,java.net.http \
            --include-locales=zh,en \
            --compress zip-6 \
            --no-header-files \
            --no-man-pages \
            --strip-debug \
            --output dist_pkg/jre

          # Unix 平台为 JRE bin 二进制赋予执行权限
          if [ -d "dist_pkg/jre/bin" ] && [ "${{ matrix.target }}" != "win-x64" ]; then
            chmod +x dist_pkg/jre/bin/*
          fi

          # 压缩归档打包
          VERSION="${{ needs.build-app.outputs.version }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd dist_pkg && 7z a -tzip "../st-cute-bundle-${{ matrix.target }}-${VERSION}.zip" .)
          else
            (cd dist_pkg && tar -czvf "../st-cute-bundle-${{ matrix.target }}-${VERSION}.tar.gz" .)
          fi

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: st-cute-bundle-${{ matrix.target }}-*.*

  # 3. 构建 Windows 桌面端绿色免安装包 (Tauri 2 壳 + JRE + app.jar)
  build-desktop-windows:
    name: Build Desktop Windows Portable Package (ZIP)
    needs: [build-app, build-jre-packages]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download App Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: app-dist

      - name: Download Windows JRE Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: pkg-win-x64
          path: pkg-win-x64

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: st-cute-desktop/src-tauri

      - name: Build Portable Desktop Bundle
        shell: bash
        run: |
          VERSION="${{ needs.build-app.outputs.version }}"

          # 解压 win-x64 bundle zip 提取 JRE 与 app.jar
          mkdir -p win_extracted
          unzip -q pkg-win-x64/st-cute-bundle-win-x64-*.zip -d win_extracted/

          # 将 JRE 与 app.jar 提前拷贝至 src-tauri/resources 以满足 tauri-build 编译期资源校验
          mkdir -p st-cute-desktop/src-tauri/resources
          cp win_extracted/app.jar st-cute-desktop/src-tauri/resources/
          cp -r win_extracted/jre st-cute-desktop/src-tauri/resources/

          # 编译 Rust 桌面端壳 Release 二进制
          cargo build --release --manifest-path st-cute-desktop/src-tauri/Cargo.toml

          # 组装绿色便携包目录
          mkdir -p dist_desktop/resources
          cp st-cute-desktop/src-tauri/target/release/st-cute.exe dist_desktop/
          cp -r win_extracted/jre dist_desktop/resources/
          cp win_extracted/app.jar dist_desktop/resources/

          # 打包为标准 zip 格式
          (cd dist_desktop && 7z a -tzip "../st-cute-desktop-win-x64-${VERSION}.zip" .)

      - name: Upload Desktop Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-desktop-win-x64
          path: st-cute-desktop-win-x64-*.*

  # 4. 汇总上传至 GitHub Release 附件列表
  publish-release:
    name: Publish GitHub Release
    needs: [build-app, build-jre-packages, build-desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Package Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true

      - name: Release Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-app.outputs.tag_name }}
          name: Release ${{ needs.build-app.outputs.tag_name }}
          generate_release_notes: true
          files: |
            st-cute-*.zip
            st-cute-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
