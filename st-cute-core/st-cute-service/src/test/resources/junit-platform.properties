# Test temp directory lock: all @TempDir instances are created under
# ~/.st-cute-test/testfiles instead of the system temp directory.
# Implementation and resolution logic: com.stioc.cute.testkit.TestTempDirFactory
#
# NOTE: comments in this file are intentionally ASCII-only. Java reads it via
# Properties.load(InputStream), which decodes as ISO-8859-1, and IDEs may fall
# back to the platform default charset for paths not listed in encodings.xml
# (Chinese comments rendered as mojibake under GBK). Keep this file ASCII-only.
junit.jupiter.tempdir.factory.default=com.stioc.cute.testkit.TestTempDirFactory
