server:
  port: 9661
  servlet:
    session:
      cookie:
        name: st-cute-token

spring:
  application:
    name: st-cute-core

  datasource:
    # 存储在用户主目录下的 .st-cute 文件夹内
    url: jdbc:sqlite:${user.home}/.st-cute/st-cute.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # 强行锁定单写连接，防止 SQLite 出现 database is locked
      maximum-pool-size: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000
      # 连接初始化时，强制将 SQLite 开启 WAL (Write-Ahead Logging) 模式
      connection-init-sql: PRAGMA journal_mode=WAL;

mybatis-flex:
  type-handlers-package: com.stioc.cute.platform.config
  configuration:
    map-underscore-to-camel-case: true

# 日志配置
logging:
  pattern:
    dateformat: "yyyy-MM-dd HH:mm:ss"
  level:
    root: INFO
    com.stioc.cute: INFO
    com.stioc.cute.repository: INFO
    org.springframework.web: INFO

st-cute:
  # 应用版本号（构建时由 Maven 资源过滤注入 pom 的 project.version）
  version: @project.version@
  llm-log:
    # 原始 HTTP 日志默认关闭（如需排查 LLM 交互报文可手动改为 true）
    http-log: false
  search:
    searxng:
      # SearXNG 聚合搜索服务基地址（不含 /search 路径，宿主层联网搜索工具数据源）
      base-url: http://61jun.com:9201
      # 访问令牌（部署级静态配置，不参与全局系统设置 config.json 的合并）
      token: st-searxng-gogogo
      # 搜索请求读取超时（秒）
      timeout-seconds: 15
