<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="freshBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#FAE8FF" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="60%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#818CF8" flood-opacity="0.2"/>
    </filter>
    <filter id="orangeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#EA580C" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="32" fill="url(#freshBg)"/>

  <!-- Main Cute Face Card -->
  <g filter="url(#softShadow)">
    <rect x="22" y="28" width="84" height="74" rx="26" fill="#FFFFFF"/>
  </g>

  <!-- Cute Little Orange on Top -->
  <g filter="url(#orangeShadow)">
    <!-- Stem -->
    <path d="M 64 16 L 64 12" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M 64 13 C 64 8, 72 8, 73 12 C 69 13, 66 15, 64 13 Z" fill="url(#leafGrad)"/>
    <!-- Orange Body -->
    <circle cx="64" cy="20" r="9.5" fill="url(#orangeGrad)"/>
    <!-- Orange Highlight -->
    <circle cx="61.5" cy="17.5" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Eyes -->
  <circle cx="48" cy="58" r="6" fill="#1E293B"/>
  <circle cx="46" cy="56" r="2.2" fill="#FFFFFF"/>
  <circle cx="80" cy="58" r="6" fill="#1E293B"/>
  <circle cx="78" cy="56" r="2.2" fill="#FFFFFF"/>
  
  <!-- Cheeks -->
  <ellipse cx="38" cy="67" rx="5" ry="3" fill="#FDA4AF" opacity="0.65"/>
  <ellipse cx="90" cy="67" rx="5" ry="3" fill="#FDA4AF" opacity="0.65"/>
  
  <!-- Smile -->
  <path d="M 56 68 Q 64 75 72 68" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Twinkling Star -->
  <path d="M 96 30 L 98 35 L 103 37 L 98 39 L 96 44 L 94 39 L 89 37 L 94 35 Z" fill="#F59E0B"/>
</svg>